plugins { id 'com.android.application' }
android {
 namespace 'com.taskflow.app'
 // Use the local sandbox key when present; otherwise use Android's default debug key.
 if (file("$rootDir/.debug/debug.keystore").exists()) {
  signingConfigs { debug { storeFile file("$rootDir/.debug/debug.keystore"); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 }
 compileSdk 34
 defaultConfig { applicationId 'com.taskflow.app'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0'; javaCompileOptions { annotationProcessorOptions { arguments += ['room.schemaLocation': "$projectDir/schemas".toString()] } } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.3'
 implementation 'androidx.lifecycle:lifecycle-livedata:2.8.3'
 implementation 'androidx.room:room-runtime:2.6.1'
 annotationProcessor 'androidx.room:room-compiler:2.6.1'
 testImplementation 'junit:junit:4.13.2'
}
